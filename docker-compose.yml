services:
  # 1. Base de Datos PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: gaes_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: capacitahub_db
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - gaes_postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d capacitahub_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Servidor Backend API (Node.js / Express)
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: gaes_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/capacitahub_db
    ports:
      - "127.0.0.1:3021:5000"
    volumes:
      - ./backups:/app/backups

  # 3. Aplicación Frontend (React + Vite + Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_MODE: "true"
        VITE_API_URL: "/api"
        VITE_SHOW_DEMO_ACCOUNTS: "true"
    container_name: gaes_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3020:80"

volumes:
  gaes_postgres_data:
