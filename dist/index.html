    <!-- Script Anti-FOUC para sincronización inmediata del tema antes del primer renderizado -->
    <script>
      (function() {
        try {
          var pref = localStorage.getItem('ch_theme_preference') || 'system';
          var isDark = pref === 'dark' || (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) {
            root.setAttribute('data-theme', 'dark');
            root.classList.add('dark');
          } else {
            root.setAttribute('data-theme', 'light');
            root.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
